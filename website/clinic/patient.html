<!DOCTYPE html>
<html lang="en" class="theme-pref-system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Healthings — Patient workspace</title>
    <script src="clinic-theme-boot.js?v=20260727c"></script>
    <link rel="icon" href="../assets/icon.png" type="image/png" />
    <link rel="stylesheet" href="../tokens.css?v=20260726j" />
    <link rel="stylesheet" href="clinic-portal.css?v=20260727i" />
    <link rel="stylesheet" href="clinic-workspace.css?v=20260727q" />
    <link rel="stylesheet" href="clinic-theme.css?v=20260728e" />
  </head>
  <body class="clinic-workspace">
    <div class="ws-chrome">
      <header class="ws-topbar ws-topbar--case">
        <a class="ws-back ws-case-lead" href="index.html" data-i18n="wsBackToPortal">← Clinic portal</a>
        <!-- Single case strip: name · demographics · rules · body stats · sync (no second row). -->
        <div id="patient-banner" class="ws-case-header" hidden></div>
        <span id="sync-status-hint" class="meta sync-status-hint" hidden></span>
        <div class="ws-case-actions">
          <select
            id="theme-workspace"
            class="portal-select theme-pref-select"
            data-theme-picker
            data-i18n-aria="appearanceLabel"
            aria-label="Appearance"
          ></select>
          <button id="refresh-snapshot-btn" class="ws-btn primary" type="button" hidden data-i18n="wsRefreshSnapshot">Refresh snapshot</button>
        </div>
      </header>
      <nav class="ws-tabs" id="ws-tabs" hidden></nav>
    </div>
    <p id="load-error" class="ws-error" hidden></p>
    <main class="ws-main" id="ws-main">
      <div id="ws-skeleton" class="ws-panel ws-skeleton" aria-busy="true" aria-live="polite">
        <div class="ws-skel-block"></div>
        <div class="ws-skel-block"></div>
        <div class="ws-skel-block"></div>
      </div>
    </main>

    <script src="clinic-api.js?v=20260726k"></script>
    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
    <script src="clinic-i18n.js?v=20260728b"></script>
    <script src="clinic-workspace-i18n.js?v=20260727j"></script>
    <script src="clinic-theme.js?v=20260727c"></script>
    <script src="clinic-charts.js?v=20260727p"></script>
    <script src="clinic-workspace.js?v=20260727ae"></script>
    <script>
      const { t } = ClinicI18n;
      function hydrateStaticCopy() {
        document.querySelectorAll('[data-i18n]').forEach((el) => {
          el.textContent = t(el.getAttribute('data-i18n'));
        });
        document.querySelectorAll('[data-i18n-aria]').forEach((el) => {
          el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria')));
        });
      }
      ClinicI18n.applyDocumentLocale();
      ClinicTheme.applyThemePref();
      hydrateStaticCopy();
      ClinicTheme.bindThemePickers();

      const { api, loadTokens, saveTokens, clearTokens } = ClinicApi;
      let pollTimer = null;
      let patientLabel = null;
      let workspaceCtx = null;

      function showError(msg) {
        const el = document.getElementById('load-error');
        el.textContent = msg || '';
        el.hidden = !msg;
      }

      function setSyncHint(text, show) {
        const hint = document.getElementById('sync-status-hint');
        hint.textContent = text || '';
        hint.hidden = !show;
      }

      function shortPatientId(patientId) {
        const id = String(patientId || '');
        return id.length > 8 ? id.slice(0, 8) : id || 'unknown';
      }

      function applyPatientLabel(label) {
        patientLabel = label;
        const tip = shortPatientId(new URLSearchParams(location.search).get('patientId'));
        document.title = label + ' — Healthings clinic';
        if (workspaceCtx) {
          workspaceCtx.displayName = label;
          const banner = document.getElementById('patient-banner');
          ClinicWorkspace.renderPatientBanner(banner, workspaceCtx, label);
          const nameEl = banner?.querySelector('.ws-banner-name');
          if (nameEl && tip) nameEl.title = tip;
        }
      }

      async function resolvePatientLabel(patientId) {
        // Soft fallback only — never “Patient · 39f11753” in the case strip.
        const soft = t('wsBannerPatient');
        try {
          const res = await api('/v1/shares?status=approved');
          if (!res.ok) return soft;
          const data = await res.json();
          const shares = data.shares || [];
          const id = String(patientId || '').toLowerCase();
          const match = shares.find((s) => String(s.patientId || '').toLowerCase() === id);
          if (!match) return soft;
          const first = typeof match.patientFirstName === 'string' ? match.patientFirstName.trim() : '';
          const last = typeof match.patientLastName === 'string' ? match.patientLastName.trim() : '';
          const name = [first, last].filter(Boolean).join(' ');
          if (name) return name;
          const email = typeof match.patientEmail === 'string' ? match.patientEmail.trim() : '';
          return email || soft;
        } catch {
          return soft;
        }
      }

      function showSkeleton() {
        const main = document.getElementById('ws-main');
        document.getElementById('ws-tabs').hidden = true;
        main.innerHTML =
          '<div id="ws-skeleton" class="ws-panel ws-skeleton" aria-busy="true" aria-live="polite">' +
          '<div class="ws-skel-block"></div>' +
          '<div class="ws-skel-block"></div>' +
          '<div class="ws-skel-block"></div>' +
          '</div>';
      }

      /** Returns true when a skeleton was actually showing, i.e. nothing had rendered yet. */
      function clearSkeleton() {
        const skel = document.getElementById('ws-skeleton');
        if (!skel) return false;
        skel.remove();
        return true;
      }

      function clearWorkspace() {
        document.getElementById('ws-main').innerHTML = '';
      }

      async function fetchSyncStatus(patientId) {
        const res = await api('/v1/clinic/patients/' + encodeURIComponent(patientId) + '/sync-status');
        if (!res.ok) return null;
        return res.json();
      }

      async function renderWorkspaceFromSync(patientId) {
        const syncRes = await api('/v1/sync/latest?patientId=' + encodeURIComponent(patientId));
        if (syncRes.status === 404) {
          showError(t('wsErrNoSnapshot'));
          document.getElementById('ws-tabs').hidden = true;
          clearSkeleton();
          clearWorkspace();
          setSyncHint('', false);
          return false;
        }
        if (!syncRes.ok) {
          showError((await syncRes.json().catch(() => ({}))).error || t('wsErrCouldNotLoad'));
          clearSkeleton();
          clearWorkspace();
          setSyncHint('', false);
          return false;
        }

        showError('');
        const syncData = await syncRes.json();
        const blob = syncData.blob;
        const bytes = Uint8Array.from(atob(syncData.payloadGzipBase64), (c) => c.charCodeAt(0));
        const payload = JSON.parse(pako.inflate(bytes, { to: 'string' }));
        const parsed = ClinicWorkspace.parseSnapshot(payload);
        if (typeof ClinicCharts !== 'undefined' && parsed.withings) {
          parsed.burnByDay = ClinicCharts.computeBurnByDay(parsed.withings);
        }

        let overlay = null;
        const ovRes = await api('/v1/clinic/patients/' + encodeURIComponent(patientId) + '/overlay');
        if (ovRes.ok) {
          const ovData = await ovRes.json();
          overlay = ovData.overlay;
        }

        if (patientLabel) {
          document.title = patientLabel + ' — Healthings clinic';
        }

        const ctx = {
          patientId,
          parsed,
          blob,
          overlay,
          api,
          displayName: patientLabel || null,
          tab: window.__clinicTab || 'dashboard',
          activeMentor: parsed.mentors[0] || 'nutritionist',
        };
        workspaceCtx = ctx;

        ClinicWorkspace.renderPatientBanner(
          document.getElementById('patient-banner'),
          ctx,
          patientLabel || null,
        );
        setSyncHint('', false);

        const main = document.getElementById('ws-main');
        const tabs = document.getElementById('ws-tabs');
        tabs.hidden = false;
        ClinicWorkspace.initTabs(tabs, ctx, main);
        ClinicWorkspace.renderWorkspace(main, ctx);
        return true;
      }

      async function loadWorkspace() {
        const params = new URLSearchParams(location.search);
        const patientId = params.get('patientId');
        if (!patientId) {
          showError(t('wsErrMissingPatientId'));
          return;
        }
        if (!loadTokens()?.access) {
          location.href = 'index.html';
          return;
        }

        // Worklist can hand us the display name so the strip never flashes the
        // id stub while /v1/shares resolves.
        const fromQuery = (params.get('name') || '').trim();
        if (fromQuery) applyPatientLabel(fromQuery);

        document.getElementById('refresh-snapshot-btn').hidden = false;
        setSyncHint(t('wsLoadingSnapshot'), true);
        showSkeleton();

        // Identity and snapshot are independent calls; serialising them doubles
        // time-to-content. renderWorkspaceFromSync re-applies the label if it
        // lands first, so either resolution order ends up correct.
        const labelPromise = resolvePatientLabel(patientId);
        const renderPromise = renderWorkspaceFromSync(patientId).catch(() => {
          showError(t('wsErrCouldNotLoad'));
          clearSkeleton();
          clearWorkspace();
          setSyncHint('', false);
          return false;
        });
        const resolved = await labelPromise;
        // Prefer a real resolved name; keep the query hint if shares only gave soft “Patient”.
        if (resolved && resolved !== t('wsBannerPatient')) {
          applyPatientLabel(resolved);
        } else if (!patientLabel) {
          applyPatientLabel(resolved);
        }
        await renderPromise;
      }

      function stopPolling() {
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
      }

      async function refreshSnapshot() {
        const patientId = new URLSearchParams(location.search).get('patientId');
        if (!patientId) return;

        const btn = document.getElementById('refresh-snapshot-btn');
        btn.disabled = true;
        const prevLabel = btn.textContent;
        btn.textContent = t('wsRefreshing');
        stopPolling();

        try {
          const reqRes = await api('/v1/clinic/patients/' + encodeURIComponent(patientId) + '/request-sync', {
            method: 'POST',
            body: '{}',
          });
          if (!reqRes.ok) {
            const err = await reqRes.json().catch(() => ({}));
            alert(err.error || t('wsErrCouldNotRefresh'));
            return;
          }

          await renderWorkspaceFromSync(patientId);

          let status = await fetchSyncStatus(patientId);
          if (!status?.waitingOnPatient) {
            setSyncHint('', false);
            return;
          }

          setSyncHint(t('wsWaitingForUpload'), true);

          let attempts = 0;
          pollTimer = setInterval(async () => {
            attempts += 1;
            status = await fetchSyncStatus(patientId);
            if (!status?.waitingOnPatient) {
              stopPolling();
              setSyncHint(t('wsNewSnapshotReceived'), true);
              await renderWorkspaceFromSync(patientId);
              setTimeout(() => setSyncHint('', false), 4000);
              return;
            }
            if (attempts >= 20) {
              stopPolling();
              setSyncHint(t('wsStillWaiting'), true);
            }
          }, 3000);
        } finally {
          btn.disabled = false;
          btn.textContent = prevLabel;
        }
      }

      document.getElementById('refresh-snapshot-btn').onclick = () => void refreshSnapshot();
      loadWorkspace();
    </script>
  </body>
</html>
