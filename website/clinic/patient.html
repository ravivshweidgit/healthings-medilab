<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Healthings — Patient workspace</title>
    <link rel="icon" href="../assets/icon.png" type="image/png" />
    <link rel="stylesheet" href="clinic-workspace.css" />
  </head>
  <body class="clinic-workspace">
    <header class="ws-topbar">
      <a href="index.html">← Clinic portal</a>
      <h1 id="patient-title">Patient workspace</h1>
      <span class="badge">Clinic view</span>
      <span id="patient-meta" class="meta">Loading…</span>
      <span id="sync-status-hint" class="meta sync-status-hint" hidden></span>
      <button id="request-sync-btn" class="ws-btn" type="button" hidden>Request fresh snapshot</button>
      <button id="reload-btn" class="ws-btn" type="button" hidden title="Fetches the latest upload from the server">Reload snapshot</button>
    </header>
    <p id="load-error" class="ws-error" hidden></p>
    <nav class="ws-tabs" id="ws-tabs" hidden></nav>
    <main class="ws-main" id="ws-main" hidden></main>

    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
    <script src="clinic-charts.js?v=20260702c"></script>
    <script src="clinic-workspace.js?v=20260702c"></script>
    <script>
      const API = 'https://api.healthings.ai';
      const TOKEN_KEY = 'healthings_clinic_tokens';

      function loadTokens() {
        try { return JSON.parse(localStorage.getItem(TOKEN_KEY) || 'null'); } catch { return null; }
      }
      function saveTokens(access, refresh) {
        localStorage.setItem(TOKEN_KEY, JSON.stringify({ access, refresh }));
      }
      function clearTokens() { localStorage.removeItem(TOKEN_KEY); }

      async function api(path, opts = {}) {
        const tokens = loadTokens();
        const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
        if (tokens?.access) headers.Authorization = 'Bearer ' + tokens.access;
        const res = await fetch(API + path, { ...opts, headers });
        if (res.status === 401 && tokens?.refresh) {
          const r = await fetch(API + '/v1/auth/refresh', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ refreshToken: tokens.refresh }),
          });
          if (r.ok) {
            const data = await r.json();
            saveTokens(data.accessToken, data.refreshToken);
            headers.Authorization = 'Bearer ' + data.accessToken;
            return fetch(API + path, { ...opts, headers });
          }
          clearTokens();
        }
        return res;
      }

      function showError(msg) {
        const el = document.getElementById('load-error');
        el.textContent = msg || '';
        el.hidden = !msg;
      }

      async function refreshSyncStatus(patientId) {
        const hint = document.getElementById('sync-status-hint');
        const requestBtn = document.getElementById('request-sync-btn');
        requestBtn.hidden = false;
        const res = await api('/v1/clinic/patients/' + encodeURIComponent(patientId) + '/sync-status');
        if (!res.ok) {
          hint.hidden = true;
          requestBtn.disabled = false;
          return;
        }
        const status = await res.json();
        if (status.waitingOnPatient) {
          const when = status.updateRequest?.requestedAt
            ? new Date(status.updateRequest.requestedAt).toLocaleString()
            : '';
          hint.textContent = 'Update requested' + (when ? ' · ' + when : '') + ' · waiting for patient to share in app';
          hint.hidden = false;
          requestBtn.disabled = true;
        } else {
          hint.hidden = true;
          requestBtn.disabled = false;
        }
      }

      async function requestFreshSnapshot(patientId) {
        const requestBtn = document.getElementById('request-sync-btn');
        requestBtn.disabled = true;
        try {
          const res = await api('/v1/clinic/patients/' + encodeURIComponent(patientId) + '/request-sync', {
            method: 'POST',
            body: '{}',
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            alert(err.error || 'Could not request snapshot');
            return;
          }
          await refreshSyncStatus(patientId);
        } finally {
          if (!document.getElementById('sync-status-hint').hidden) return;
          requestBtn.disabled = false;
        }
      }

      async function loadWorkspace() {
        const patientId = new URLSearchParams(location.search).get('patientId');
        if (!patientId) {
          showError('Missing patientId in URL.');
          return;
        }
        if (!loadTokens()?.access) {
          location.href = 'index.html';
          return;
        }

        showError('');
        document.getElementById('patient-meta').textContent = 'Loading snapshot…';
        document.getElementById('reload-btn').hidden = false;
        void refreshSyncStatus(patientId);

        const syncRes = await api('/v1/sync/latest?patientId=' + encodeURIComponent(patientId));
        if (syncRes.status === 404) {
          showError('No snapshot yet. Tap “Request fresh snapshot” — the patient will see a banner in the app to share.');
          return;
        }
        if (!syncRes.ok) {
          showError((await syncRes.json().catch(() => ({}))).error || 'Could not load snapshot');
          return;
        }

        const syncData = await syncRes.json();
        const blob = syncData.blob;
        const bytes = Uint8Array.from(atob(syncData.payloadGzipBase64), (c) => c.charCodeAt(0));
        const payload = JSON.parse(pako.inflate(bytes, { to: 'string' }));
        const parsed = ClinicWorkspace.parseSnapshot(payload);
        if (typeof ClinicCharts !== 'undefined' && parsed.withings) {
          parsed.burnByDay = ClinicCharts.computeBurnByDay(parsed.withings);
        }

        let overlay = null;
        const ovRes = await api('/v1/clinic/patients/' + encodeURIComponent(patientId) + '/overlay');
        if (ovRes.ok) {
          const ovData = await ovRes.json();
          overlay = ovData.overlay;
        }

        document.getElementById('patient-title').textContent = 'Patient workspace';
        document.getElementById('patient-meta').textContent =
          'Snapshot v' + blob.version + ' · shared ' + new Date(blob.createdAt).toLocaleString() +
          ' · ' + Math.round(blob.byteSize / 1024) + ' KB' +
          (overlay?.rules ? ' · clinic rules active' : '');

        const ctx = {
          patientId,
          parsed,
          blob,
          overlay,
          api,
          tab: 'dashboard',
          activeMentor: parsed.mentors[0] || 'nutritionist',
        };

        const main = document.getElementById('ws-main');
        const tabs = document.getElementById('ws-tabs');
        tabs.hidden = false;
        main.hidden = false;
        ClinicWorkspace.initTabs(tabs, ctx, main);
        ClinicWorkspace.renderWorkspace(main, ctx);
        void refreshSyncStatus(patientId);
      }

      document.getElementById('reload-btn').onclick = () => void loadWorkspace();
      document.getElementById('request-sync-btn').onclick = () => {
        const patientId = new URLSearchParams(location.search).get('patientId');
        if (patientId) void requestFreshSnapshot(patientId);
      };
      loadWorkspace();
    </script>
  </body>
</html>
