<!DOCTYPE html>
<html lang="en" class="theme-auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Healthings — Patient workspace</title>
    <link rel="icon" href="../assets/icon.png" type="image/png" />
    <link rel="stylesheet" href="../tokens.css?v=20260726j" />
    <link rel="stylesheet" href="clinic-portal.css?v=20260727g" />
    <link rel="stylesheet" href="clinic-workspace.css?v=20260727e" />
  </head>
  <body class="clinic-workspace">
    <div class="ws-chrome">
      <header class="ws-topbar">
        <a href="index.html">← Clinic portal</a>
        <h1 id="patient-title">Patient workspace</h1>
        <span class="badge">Clinic view</span>
        <span id="patient-meta" class="meta">Loading…</span>
        <span id="clinic-rules-chip" class="chip ok" hidden>Clinic rules active</span>
        <span id="sync-status-hint" class="meta sync-status-hint" hidden></span>
        <button id="refresh-snapshot-btn" class="ws-btn primary" type="button" hidden>Refresh snapshot</button>
      </header>
      <div id="patient-banner" class="ws-banner" hidden></div>
      <nav class="ws-tabs" id="ws-tabs" hidden></nav>
    </div>
    <p id="load-error" class="ws-error" hidden></p>
    <main class="ws-main" id="ws-main">
      <div id="ws-skeleton" class="ws-panel ws-skeleton" aria-busy="true" aria-live="polite">
        <div class="ws-skel-block"></div>
        <div class="ws-skel-block"></div>
        <div class="ws-skel-block"></div>
      </div>
    </main>

    <script src="clinic-api.js?v=20260726k"></script>
    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
    <script src="clinic-charts.js?v=20260727b"></script>
    <script src="clinic-workspace.js?v=20260727f"></script>
    <script>
      const { api, loadTokens, saveTokens, clearTokens } = ClinicApi;
      let pollTimer = null;
      let patientLabel = null;
      let workspaceCtx = null;

      function showError(msg) {
        const el = document.getElementById('load-error');
        el.textContent = msg || '';
        el.hidden = !msg;
      }

      function setSyncHint(text, show) {
        const hint = document.getElementById('sync-status-hint');
        hint.textContent = text || '';
        hint.hidden = !show;
      }

      function shortPatientId(patientId) {
        const id = String(patientId || '');
        return id.length > 8 ? id.slice(0, 8) : id || 'unknown';
      }

      function applyPatientLabel(label) {
        patientLabel = label;
        document.getElementById('patient-title').textContent = label;
        document.title = label + ' — Healthings clinic';
        if (workspaceCtx) {
          workspaceCtx.displayName = label;
          ClinicWorkspace.renderPatientBanner(
            document.getElementById('patient-banner'),
            workspaceCtx,
            label,
          );
        }
      }

      async function resolvePatientLabel(patientId) {
        const fallback = 'Patient · ' + shortPatientId(patientId);
        try {
          const res = await api('/v1/shares?status=approved');
          if (!res.ok) return fallback;
          const data = await res.json();
          const shares = data.shares || [];
          const match = shares.find((s) => s.patientId === patientId);
          if (!match) return fallback;
          const first = typeof match.patientFirstName === 'string' ? match.patientFirstName.trim() : '';
          const last = typeof match.patientLastName === 'string' ? match.patientLastName.trim() : '';
          const name = [first, last].filter(Boolean).join(' ');
          if (name) return name;
          const email = typeof match.patientEmail === 'string' ? match.patientEmail.trim() : '';
          return email || fallback;
        } catch {
          return fallback;
        }
      }

      function showSkeleton() {
        const main = document.getElementById('ws-main');
        document.getElementById('ws-tabs').hidden = true;
        main.innerHTML =
          '<div id="ws-skeleton" class="ws-panel ws-skeleton" aria-busy="true" aria-live="polite">' +
          '<div class="ws-skel-block"></div>' +
          '<div class="ws-skel-block"></div>' +
          '<div class="ws-skel-block"></div>' +
          '</div>';
      }

      /** Returns true when a skeleton was actually showing, i.e. nothing had rendered yet. */
      function clearSkeleton() {
        const skel = document.getElementById('ws-skeleton');
        if (!skel) return false;
        skel.remove();
        return true;
      }

      function clearWorkspace() {
        document.getElementById('ws-main').innerHTML = '';
      }

      async function fetchSyncStatus(patientId) {
        const res = await api('/v1/clinic/patients/' + encodeURIComponent(patientId) + '/sync-status');
        if (!res.ok) return null;
        return res.json();
      }

      async function renderWorkspaceFromSync(patientId) {
        const syncRes = await api('/v1/sync/latest?patientId=' + encodeURIComponent(patientId));
        if (syncRes.status === 404) {
          showError('No snapshot yet. Tap Refresh snapshot — patient phone uploads when they open the app.');
          document.getElementById('ws-tabs').hidden = true;
          clearSkeleton();
          clearWorkspace();
          document.getElementById('patient-meta').textContent = '';
          return false;
        }
        if (!syncRes.ok) {
          showError((await syncRes.json().catch(() => ({}))).error || 'Could not load snapshot');
          clearSkeleton();
          clearWorkspace();
          document.getElementById('patient-meta').textContent = '';
          return false;
        }

        showError('');
        const syncData = await syncRes.json();
        const blob = syncData.blob;
        const bytes = Uint8Array.from(atob(syncData.payloadGzipBase64), (c) => c.charCodeAt(0));
        const payload = JSON.parse(pako.inflate(bytes, { to: 'string' }));
        const parsed = ClinicWorkspace.parseSnapshot(payload);
        if (typeof ClinicCharts !== 'undefined' && parsed.withings) {
          parsed.burnByDay = ClinicCharts.computeBurnByDay(parsed.withings);
        }

        let overlay = null;
        const ovRes = await api('/v1/clinic/patients/' + encodeURIComponent(patientId) + '/overlay');
        if (ovRes.ok) {
          const ovData = await ovRes.json();
          overlay = ovData.overlay;
        }

        if (patientLabel) {
          document.getElementById('patient-title').textContent = patientLabel;
          document.title = patientLabel + ' — Healthings clinic';
        }

        const ctx = {
          patientId,
          parsed,
          blob,
          overlay,
          api,
          displayName: patientLabel || null,
          tab: window.__clinicTab || 'dashboard',
          activeMentor: parsed.mentors[0] || 'nutritionist',
        };
        workspaceCtx = ctx;

        ClinicWorkspace.paintHeaderMeta(
          document.getElementById('patient-meta'),
          document.getElementById('clinic-rules-chip'),
          ctx,
        );

        const main = document.getElementById('ws-main');
        const tabs = document.getElementById('ws-tabs');
        tabs.hidden = false;
        ClinicWorkspace.initTabs(tabs, ctx, main);
        ClinicWorkspace.renderWorkspace(main, ctx);
        return true;
      }

      async function loadWorkspace() {
        const patientId = new URLSearchParams(location.search).get('patientId');
        if (!patientId) {
          showError('Missing patientId in URL.');
          return;
        }
        if (!loadTokens()?.access) {
          location.href = 'index.html';
          return;
        }

        document.getElementById('refresh-snapshot-btn').hidden = false;
        document.getElementById('patient-meta').textContent = 'Loading snapshot…';
        setSyncHint('', false);
        showSkeleton();

        // Identity and snapshot are independent calls; serialising them doubles
        // time-to-content. renderWorkspaceFromSync re-applies the label if it
        // lands first, so either resolution order ends up correct.
        const labelPromise = resolvePatientLabel(patientId);
        const renderPromise = renderWorkspaceFromSync(patientId).catch(() => {
          showError('Could not load snapshot');
          clearSkeleton();
          clearWorkspace();
          document.getElementById('patient-meta').textContent = '';
          return false;
        });
        applyPatientLabel(await labelPromise);
        await renderPromise;
      }

      function stopPolling() {
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
      }

      async function refreshSnapshot() {
        const patientId = new URLSearchParams(location.search).get('patientId');
        if (!patientId) return;

        const btn = document.getElementById('refresh-snapshot-btn');
        btn.disabled = true;
        const prevLabel = btn.textContent;
        btn.textContent = 'Refreshing…';
        stopPolling();

        try {
          const reqRes = await api('/v1/clinic/patients/' + encodeURIComponent(patientId) + '/request-sync', {
            method: 'POST',
            body: '{}',
          });
          if (!reqRes.ok) {
            const err = await reqRes.json().catch(() => ({}));
            alert(err.error || 'Could not refresh snapshot');
            return;
          }

          await renderWorkspaceFromSync(patientId);

          let status = await fetchSyncStatus(patientId);
          if (!status?.waitingOnPatient) {
            setSyncHint('', false);
            return;
          }

          setSyncHint('Waiting for patient app to upload snapshot… checking every few seconds', true);

          let attempts = 0;
          pollTimer = setInterval(async () => {
            attempts += 1;
            status = await fetchSyncStatus(patientId);
            if (!status?.waitingOnPatient) {
              stopPolling();
              setSyncHint('New snapshot received', true);
              await renderWorkspaceFromSync(patientId);
              setTimeout(() => setSyncHint('', false), 4000);
              return;
            }
            if (attempts >= 20) {
              stopPolling();
              setSyncHint('Still waiting — ensure the patient app is open (or pull down to refresh on the phone), then tap Refresh snapshot again', true);
            }
          }, 3000);
        } finally {
          btn.disabled = false;
          btn.textContent = prevLabel;
        }
      }

      document.getElementById('refresh-snapshot-btn').onclick = () => void refreshSnapshot();
      loadWorkspace();
    </script>
  </body>
</html>
