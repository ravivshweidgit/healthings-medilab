<!DOCTYPE html>
<html lang="en" class="theme-auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Healthings — Clinic portal</title>
    <link rel="icon" href="../assets/icon.png" type="image/png" />
    <link rel="stylesheet" href="../tokens.css?v=20260726g" />
    <link rel="stylesheet" href="../styles.css?v=20260726g" />
    <link rel="stylesheet" href="clinic-portal.css?v=20260726g" />
  </head>
  <body>
    <div class="portal-wrap">
      <section id="login-view" class="card login-card">
        <a class="panel-brand" href="../index.html" style="margin-bottom: 16px">
          <img src="../assets/icon.png" alt="" width="36" height="36" />
          <span>
            <span class="panel-brand-text" data-i18n="brand">Healthings</span><br />
            <span class="panel-brand-sub" data-i18n="brandSub">Clinic</span>
          </span>
        </a>
        <h1 data-i18n="loginTitle">Clinic portal</h1>
        <p class="muted" data-i18n="loginLead">Sign in with your clinic account (email code).</p>

        <form id="login-form-email">
          <label class="field-label" for="email" data-i18n="emailLabel">Email</label>
          <input
            id="email"
            class="portal-input"
            type="email"
            name="email"
            dir="ltr"
            autocomplete="email"
            required
          />
          <button id="send-code" class="portal-btn" type="submit" data-i18n="sendCode">Send code</button>
        </form>

        <form id="login-form-code" hidden>
          <p class="muted">
            <span data-i18n="codeSentTo">Code sent to</span> <span id="email-display" dir="ltr"></span>
          </p>
          <label class="field-label" for="code" data-i18n="codeLabel">One-time code</label>
          <input
            id="code"
            class="portal-input"
            type="text"
            name="code"
            dir="ltr"
            inputmode="numeric"
            maxlength="6"
            autocomplete="one-time-code"
            required
          />
          <button id="verify-code" class="portal-btn" type="submit" data-i18n="signIn">Sign in</button>
          <button id="change-email" class="portal-btn secondary" type="button" data-i18n="changeEmail">
            Change email
          </button>
        </form>

        <p id="login-error" class="error" role="alert" hidden></p>

        <label class="field-label" for="locale-login" data-i18n="languageLabel">Portal language</label>
        <select id="locale-login" class="portal-select" data-locale-picker></select>
      </section>

      <section id="app-view" hidden>
        <header class="panel-header">
          <a class="panel-brand" href="../index.html">
            <img src="../assets/icon.png" alt="" width="36" height="36" />
            <span>
              <span class="panel-brand-text" data-i18n="brand">Healthings</span><br />
              <span class="panel-brand-sub" data-i18n="brandSub">Clinic</span>
            </span>
          </a>
          <div class="panel-header-meta">
            <span class="muted" id="header-email" dir="ltr"></span>
            <span class="balance-chip" id="balance-chip">—</span>
            <select
              id="locale-app"
              class="portal-select"
              data-locale-picker
              data-i18n-aria="languageLabel"
            ></select>
            <button id="logout" class="portal-btn secondary" type="button" data-i18n="signOut">
              Sign out
            </button>
          </div>
        </header>

        <p id="app-flash" class="portal-status" role="status" aria-live="polite" hidden></p>

        <div class="invite-strip">
          <div class="invite-field">
            <label class="field-label" for="patient-email" data-i18n="inviteLabel">Invite patient</label>
            <input
              id="patient-email"
              class="portal-input"
              type="email"
              dir="ltr"
              data-i18n-placeholder="invitePlaceholder"
              autocomplete="email"
            />
          </div>
          <button id="invite-btn" class="portal-btn" type="button" data-i18n="sendInvite">Send invite</button>
          <p
            id="invite-status"
            class="portal-status"
            role="status"
            aria-live="polite"
            hidden
            style="flex: 1 1 100%"
          ></p>
        </div>
        <p class="muted invite-note" data-i18n="inviteNote"></p>

        <div class="worklist-toolbar">
          <!-- aria-pressed, not role=tab: these filter a table in place, they do not
               switch tabpanels, and role=tab without a panel misleads a screen reader. -->
          <div class="filter-chips" role="group" data-i18n-aria="filterLabel">
            <button type="button" class="chip-btn active" data-filter="linked" aria-pressed="true">
              <span data-i18n="filterLinked">Linked</span> <span class="n" id="count-linked">(0)</span>
            </button>
            <button type="button" class="chip-btn" data-filter="pending" aria-pressed="false">
              <span data-i18n="filterPending">Pending</span> <span class="n" id="count-pending">(0)</span>
            </button>
            <button type="button" class="chip-btn" data-filter="outgoing" aria-pressed="false">
              <span data-i18n="filterOutgoing">Outgoing</span> <span class="n" id="count-outgoing">(0)</span>
            </button>
            <button type="button" class="chip-btn" data-filter="all" aria-pressed="false">
              <span data-i18n="filterAll">All</span> <span class="n" id="count-all">(0)</span>
            </button>
          </div>
          <input
            id="worklist-search"
            class="portal-input worklist-search"
            type="search"
            data-i18n-placeholder="searchPlaceholder"
            autocomplete="off"
          />
          <select id="worklist-sort" class="portal-select worklist-sort" data-i18n-aria="sortLabel">
            <option value="email" data-i18n="sortEmail">Email A–Z</option>
            <option value="sync" data-i18n="sortSync">Last sync</option>
            <option value="sponsor" data-i18n="sortSponsor">Sponsorship</option>
          </select>
        </div>

        <div class="worklist-panel">
          <table class="worklist-table">
            <thead>
              <tr>
                <th scope="col" data-i18n="colPatient">Patient</th>
                <th scope="col" data-i18n="colSync">Sync</th>
                <th scope="col" data-i18n="colSponsor">Sponsor</th>
                <th scope="col" data-i18n="colActions">Actions</th>
              </tr>
            </thead>
            <tbody id="worklist-body"></tbody>
          </table>
          <div id="worklist-empty" class="worklist-empty muted" hidden></div>
          <div class="worklist-pager" id="worklist-pager" hidden>
            <span id="pager-label" class="muted"></span>
            <div class="row-actions">
              <button type="button" class="portal-btn secondary" id="pager-prev" data-i18n="previous">
                Previous
              </button>
              <button type="button" class="portal-btn secondary" id="pager-next" data-i18n="next">Next</button>
            </div>
          </div>
        </div>

        <details class="secondary-panel">
          <summary>
            <strong data-i18n="myClinicSummary">My clinic</strong> —
            <span class="muted" data-i18n="myClinicHint">display name shown to patients</span>
          </summary>
          <label class="field-label" for="display-name" data-i18n="displayNameLabel">Clinic display name</label>
          <input
            id="display-name"
            class="portal-input"
            type="text"
            data-i18n-placeholder="displayNamePlaceholder"
          />
          <button id="save-name" class="portal-btn secondary" type="button" data-i18n="saveName">Save name</button>
          <p id="name-status" class="portal-status" role="status" aria-live="polite" hidden></p>
        </details>

        <div class="secondary-panel dev-only" id="dev-wallet" hidden>
          <h2 data-i18n="creditsTitle">AI credits (alpha)</h2>
          <p class="muted" data-i18n="creditsLead"></p>
          <p><strong data-i18n="balance">Balance:</strong> <span id="wallet-balance">—</span> tokens</p>
          <p class="muted" id="wallet-pm"></p>
          <button id="simulate-card-btn" class="portal-btn secondary" type="button" data-i18n="attachCard">
            Attach test card (alpha)
          </button>
          <button id="load-pack-btn" class="portal-btn" type="button" data-i18n="manualPack">
            Manual token pack
          </button>
        </div>

        <div class="secondary-panel dev-only" id="dev-usage" hidden>
          <h2 data-i18n="usageTitle">AI usage (alpha)</h2>
          <p class="muted" data-i18n="usageLead"></p>
          <div id="usage-summary"></div>
        </div>

        <p id="app-error" class="error" role="alert" hidden></p>
      </section>
    </div>

    <script src="clinic-i18n.js?v=20260726g"></script>
    <script src="clinic-api.js?v=20260726g"></script>
    <script>
      const { api, loadTokens, saveTokens, clearTokens } = ClinicApi;
      const { t, CLINIC_LOCALES } = ClinicI18n;
      const OTP_PENDING_KEY = 'healthings_clinic_otp_pending';
      const DEV_KEY = 'healthings_clinic_dev';
      const PAGE_SIZE = 25;
      const SPONSOR_DAY_CHOICES = [30, 60, 90, 180, 365];

      const loginErrorEl = () => document.getElementById('login-error');
      const appErrorEl = () => document.getElementById('app-error');

      let loginEmail = '';
      const worklistState = {
        filter: 'linked',
        search: '',
        sort: 'email',
        page: 0,
        pending: [],
        outgoing: [],
        approved: [],
        sponsorByPatient: new Map(),
        act: null,
      };

      /* ── i18n plumbing ─────────────────────────────────────────────────── */

      function hydrateStaticCopy() {
        document.querySelectorAll('[data-i18n]').forEach((el) => {
          el.textContent = t(el.getAttribute('data-i18n'));
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => {
          el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
        });
        document.querySelectorAll('[data-i18n-aria]').forEach((el) => {
          el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria')));
        });
      }

      function buildLocalePickers() {
        document.querySelectorAll('[data-locale-picker]').forEach((sel) => {
          sel.replaceChildren();
          CLINIC_LOCALES.forEach((l) => {
            const opt = document.createElement('option');
            opt.value = l.code;
            opt.textContent = l.flag + ' ' + l.name;
            if (l.code === ClinicI18n.getLocale()) opt.selected = true;
            sel.appendChild(opt);
          });
          sel.onchange = () => {
            ClinicI18n.setLocale(sel.value);
            applyLocale();
          };
        });
      }

      function applyLocale() {
        ClinicI18n.applyDocumentLocale();
        hydrateStaticCopy();
        buildLocalePickers();
        renderWorklist();
      }

      /* ── helpers ───────────────────────────────────────────────────────── */

      function isDevMode() {
        try {
          if (new URLSearchParams(location.search).get('dev') === '1') {
            sessionStorage.setItem(DEV_KEY, '1');
            return true;
          }
          return sessionStorage.getItem(DEV_KEY) === '1';
        } catch {
          return new URLSearchParams(location.search).get('dev') === '1';
        }
      }

      function applyDevMode() {
        const on = isDevMode();
        document.querySelectorAll('.dev-only').forEach((el) => {
          el.hidden = !on;
        });
      }

      function showError(el, msg) {
        el.textContent = msg || '';
        el.hidden = !msg;
      }

      function setInviteStatus(kind, msg) {
        const el = document.getElementById('invite-status');
        el.className = 'portal-status' + (kind ? ' ' + kind : '');
        el.textContent = msg || '';
        el.hidden = !msg;
      }

      function setFlash(kind, msg) {
        const el = document.getElementById('app-flash');
        el.className = 'portal-status' + (kind ? ' ' + kind : '');
        el.textContent = msg || '';
        el.hidden = !msg;
      }

      function setStatus(id, kind, msg) {
        const el = document.getElementById(id);
        el.className = 'portal-status' + (kind ? ' ' + kind : '');
        el.textContent = msg || '';
        el.hidden = !msg;
      }

      function formatExpiry(iso) {
        try {
          return new Date(iso).toLocaleDateString(ClinicI18n.getLocale(), {
            year: 'numeric',
            month: 'short',
            day: 'numeric',
          });
        } catch {
          return iso;
        }
      }

      function daysUntil(iso) {
        const target = new Date(iso);
        if (Number.isNaN(target.getTime())) return null;
        const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
        const ms = startOfDay(target) - startOfDay(new Date());
        return Math.round(ms / 86400000);
      }

      function pluralDays(n) {
        return Math.abs(n) === 1 ? t('oneDay') : t('nDays', { n: Math.abs(n) });
      }

      function relativeSync(iso) {
        if (!iso) return t('syncNever');
        const ms = new Date(iso).getTime();
        if (Number.isNaN(ms)) return t('syncNever');
        const sec = Math.round((Date.now() - ms) / 1000);
        if (sec < 60) return t('syncJustNow');
        const min = Math.round(sec / 60);
        if (min < 60) return t('syncMinutesAgo', { n: min });
        const hr = Math.round(min / 60);
        if (hr < 48) return t('syncHoursAgo', { n: hr });
        const days = Math.round(hr / 24);
        if (days < 14) return t('syncDaysAgo', { n: days });
        return formatExpiry(iso);
      }

      function sponsorChip(sp) {
        const chip = document.createElement('span');
        chip.className = 'chip';
        if (!sp) {
          chip.classList.add('off');
          chip.textContent = t('notSponsored');
          return chip;
        }
        const left = daysUntil(sp.expiresAt);
        const on = sp.active && left !== null && left >= 0;
        if (!on) {
          chip.classList.add('gone');
          chip.textContent =
            left === null
              ? t('sponsorshipExpired')
              : t('sponsorshipEndedAgo', { days: pluralDays(left) });
          chip.title = t('endedOn', { date: formatExpiry(sp.expiresAt) });
          return chip;
        }
        chip.classList.add(left <= 7 ? 'soon' : 'ok');
        chip.textContent =
          left === 0 ? t('sponsoredEndsToday') : t('sponsoredDaysLeft', { days: pluralDays(left) });
        chip.title = t('untilDate', { date: formatExpiry(sp.expiresAt) });
        return chip;
      }

      async function withBusy(btn, busyLabel, fn) {
        const group = btn.closest('.row-actions') || btn.parentElement;
        const controls = group ? [...group.querySelectorAll('button, select, a.portal-btn')] : [btn];
        const idle = btn.textContent;
        const restore = controls.map((c) => [c, c.disabled, c.getAttribute('aria-disabled')]);
        controls.forEach((c) => {
          if ('disabled' in c) c.disabled = true;
          c.setAttribute('aria-disabled', 'true');
        });
        btn.textContent = busyLabel;
        btn.setAttribute('aria-busy', 'true');
        try {
          return await fn();
        } finally {
          btn.textContent = idle;
          btn.removeAttribute('aria-busy');
          restore.forEach(([c, wasDisabled, ariaWas]) => {
            if ('disabled' in c) c.disabled = wasDisabled;
            if (ariaWas === null) c.removeAttribute('aria-disabled');
            else c.setAttribute('aria-disabled', ariaWas);
          });
        }
      }

      /* ── worklist ──────────────────────────────────────────────────────── */

      function statusSub(share) {
        if (share.status === 'pending' && share.initiatedBy === 'mentor') {
          return t('statusWaitingApproval');
        }
        if (share.status === 'pending' && share.initiatedBy === 'patient') {
          return t('statusPatientRequested');
        }
        return (
          {
            approved: t('statusApproved'),
            rejected: t('statusRejected'),
            revoked: t('statusRevoked'),
          }[share.status] || share.status
        );
      }

      function filteredShares() {
        const { filter, search, sort, pending, outgoing, approved, sponsorByPatient } = worklistState;
        let list =
          filter === 'linked'
            ? approved.slice()
            : filter === 'pending'
              ? pending.slice()
              : filter === 'outgoing'
                ? outgoing.slice()
                : approved.concat(pending, outgoing);

        const q = search.trim().toLowerCase();
        if (q) list = list.filter((s) => (s.patientEmail || '').toLowerCase().includes(q));

        list.sort((a, b) => {
          if (sort === 'sync') {
            const ta = a.lastSyncAt ? new Date(a.lastSyncAt).getTime() : 0;
            const tb = b.lastSyncAt ? new Date(b.lastSyncAt).getTime() : 0;
            return tb - ta;
          }
          if (sort === 'sponsor') {
            const sa = a.patientId ? sponsorByPatient.get(a.patientId) : null;
            const sb = b.patientId ? sponsorByPatient.get(b.patientId) : null;
            const da = sa && sa.active ? (daysUntil(sa.expiresAt) ?? 99999) : 99999;
            const db = sb && sb.active ? (daysUntil(sb.expiresAt) ?? 99999) : 99999;
            return da - db;
          }
          return (a.patientEmail || '').localeCompare(b.patientEmail || '', ClinicI18n.getLocale(), {
            sensitivity: 'base',
          });
        });
        return list;
      }

      function fillActions(actions, share, onAction, sponsorByPatient) {
        actions.replaceChildren();
        const sp = share.patientId ? sponsorByPatient.get(share.patientId) : null;

        if (share.status === 'pending' && share.initiatedBy === 'patient') {
          const ok = document.createElement('button');
          ok.className = 'portal-btn';
          ok.type = 'button';
          ok.textContent = t('approve');
          ok.onclick = () => void onAction('approve', share.id, { email: share.patientEmail, btn: ok });
          const no = document.createElement('button');
          no.className = 'portal-btn secondary';
          no.type = 'button';
          no.textContent = t('reject');
          no.onclick = () => void onAction('reject', share.id, { email: share.patientEmail, btn: no });
          actions.append(ok, no);
          return;
        }

        if (share.status === 'pending' && share.initiatedBy === 'mentor') {
          const cancel = document.createElement('button');
          cancel.className = 'portal-btn secondary';
          cancel.type = 'button';
          cancel.textContent = t('cancelInvite');
          cancel.onclick = () =>
            void onAction('cancel', share.id, { email: share.patientEmail, btn: cancel });
          actions.append(cancel);
          return;
        }

        if (share.status !== 'approved') return;

        if (share.patientId) {
          const view = document.createElement('a');
          view.className = 'portal-btn';
          view.textContent = t('openWorkspace');
          view.href = 'patient.html?patientId=' + encodeURIComponent(share.patientId);
          actions.append(view);

          const active = sp && sp.active && daysUntil(sp.expiresAt) >= 0;
          const spBtn = document.createElement('button');
          spBtn.className = 'portal-btn secondary';
          spBtn.type = 'button';
          spBtn.textContent = active
            ? t('stopSponsorship')
            : sp
              ? t('renewSponsorship')
              : t('sponsorAi');

          if (active) {
            spBtn.onclick = () =>
              void onAction('sponsor-off', share.patientId, {
                email: share.patientEmail,
                btn: spBtn,
              });
          } else {
            // Inline duration picker instead of window.prompt (be-21): the choice
            // stays in the page, is keyboard reachable, and shows the end date.
            spBtn.onclick = () => {
              const form = document.createElement('div');
              form.className = 'sponsor-form row-actions';
              const label = document.createElement('label');
              label.className = 'muted';
              label.textContent = t('sponsorFor');
              const select = document.createElement('select');
              select.className = 'portal-select';
              SPONSOR_DAY_CHOICES.forEach((d) => {
                const opt = document.createElement('option');
                opt.value = String(d);
                opt.textContent = t('daysOption', { n: d });
                if (d === 90) opt.selected = true;
                select.appendChild(opt);
              });
              const until = document.createElement('span');
              until.className = 'muted';
              const showUntil = () => {
                const end = new Date();
                end.setDate(end.getDate() + parseInt(select.value, 10));
                until.textContent = t('until', { date: formatExpiry(end.toISOString()) });
              };
              select.onchange = showUntil;
              showUntil();
              const go = document.createElement('button');
              go.className = 'portal-btn';
              go.type = 'button';
              go.textContent = t('startSponsorship');
              go.onclick = () =>
                void onAction('sponsor-on', share.patientId, {
                  email: share.patientEmail,
                  btn: go,
                  days: parseInt(select.value, 10),
                });
              const back = document.createElement('button');
              back.className = 'portal-btn secondary';
              back.type = 'button';
              back.textContent = t('cancel');
              back.onclick = () => form.replaceWith(actions);
              form.append(label, select, until, go, back);
              actions.replaceWith(form);
              select.focus();
            };
          }
          actions.append(spBtn);
        }

        const rev = document.createElement('button');
        rev.className = 'portal-btn danger';
        rev.type = 'button';
        rev.textContent = t('revokeAccess');
        rev.onclick = () => void onAction('revoke', share.id, { email: share.patientEmail, btn: rev });
        actions.append(rev);
      }

      function emptyMessage() {
        if (worklistState.search.trim()) return t('emptySearch');
        return {
          pending: t('emptyPending'),
          outgoing: t('emptyOutgoing'),
          all: t('emptyAll'),
        }[worklistState.filter] || t('emptyLinked');
      }

      function renderWorklist() {
        const body = document.getElementById('worklist-body');
        const empty = document.getElementById('worklist-empty');
        const pager = document.getElementById('worklist-pager');
        if (!body) return;

        const list = filteredShares();
        const total = list.length;
        const maxPage = Math.max(0, Math.ceil(total / PAGE_SIZE) - 1);
        if (worklistState.page > maxPage) worklistState.page = maxPage;
        const start = worklistState.page * PAGE_SIZE;
        const pageItems = list.slice(start, start + PAGE_SIZE);

        body.replaceChildren();
        if (!pageItems.length) {
          empty.hidden = false;
          empty.textContent = emptyMessage();
          pager.hidden = true;
          return;
        }
        empty.hidden = true;

        pageItems.forEach((share) => {
          const tr = document.createElement('tr');
          const sp = share.patientId ? worklistState.sponsorByPatient.get(share.patientId) : null;

          const tdEmail = document.createElement('td');
          tdEmail.className = 'email-cell';
          tdEmail.dataset.label = t('colPatient');
          const emailLine = document.createElement('div');
          // ltr, not auto: an address is LTR syntax (local@domain). dir="auto" reads
          // a Hebrew local part as an RTL string and puts the domain on the left,
          // which looks like corruption. Hebrew glyphs still shape RTL inside the run.
          emailLine.dir = 'ltr';
          emailLine.textContent = share.patientEmail || '—';
          const sub = document.createElement('div');
          sub.className = 'muted';
          sub.textContent = statusSub(share);
          tdEmail.append(emailLine, sub);

          const tdSync = document.createElement('td');
          tdSync.dataset.label = t('colSync');
          tdSync.textContent = share.status === 'approved' ? relativeSync(share.lastSyncAt) : '—';
          if (share.lastSyncAt) tdSync.title = formatExpiry(share.lastSyncAt);

          const tdSp = document.createElement('td');
          tdSp.dataset.label = t('colSponsor');
          if (share.status === 'approved' && share.patientId) tdSp.appendChild(sponsorChip(sp));
          else tdSp.textContent = '—';

          const tdAct = document.createElement('td');
          tdAct.dataset.label = t('colActions');
          const actions = document.createElement('div');
          actions.className = 'row-actions';
          fillActions(actions, share, worklistState.act, worklistState.sponsorByPatient);
          tdAct.appendChild(actions);

          tr.append(tdEmail, tdSync, tdSp, tdAct);
          body.appendChild(tr);
        });

        if (total > PAGE_SIZE) {
          pager.hidden = false;
          document.getElementById('pager-label').textContent = t('showingRange', {
            from: start + 1,
            to: Math.min(start + PAGE_SIZE, total),
            total,
          });
          document.getElementById('pager-prev').disabled = worklistState.page <= 0;
          document.getElementById('pager-next').disabled = worklistState.page >= maxPage;
        } else {
          pager.hidden = true;
        }
      }

      function setCounts() {
        const { pending, outgoing, approved } = worklistState;
        const set = (id, n) => {
          document.getElementById(id).textContent = '(' + n + ')';
        };
        set('count-linked', approved.length);
        set('count-pending', pending.length);
        set('count-outgoing', outgoing.length);
        set('count-all', approved.length + pending.length + outgoing.length);
      }

      function renderUsageSummary(el, data) {
        el.replaceChildren();
        if (!data || !data.byPatient || data.byPatient.length === 0) {
          const p = document.createElement('p');
          p.className = 'muted';
          p.textContent = t('noUsage');
          el.appendChild(p);
          return;
        }
        const total = document.createElement('p');
        const strong = document.createElement('strong');
        strong.textContent = t('usageTotal');
        total.append(strong, document.createTextNode(String(data.totalTokens)));
        el.appendChild(total);
        data.byPatient.forEach((row) => {
          const wrap = document.createElement('div');
          wrap.style.marginTop = '8px';
          const who = document.createElement('strong');
          who.dir = 'ltr';
          who.textContent = row.patientEmail;
          const detail = document.createElement('span');
          detail.className = 'muted';
          detail.textContent =
            ' — ' + t('usageRow', { tokens: row.totalTokens, events: row.eventCount });
          wrap.append(who, detail);
          el.appendChild(wrap);
        });
      }

      /* ── data ──────────────────────────────────────────────────────────── */

      async function refreshDashboard() {
        const meRes = await api('/v1/me');
        if (!meRes.ok) {
          const err = new Error(meRes.status === 401 ? t('sessionExpired') : t('couldNotLoadAccount'));
          err.status = meRes.status;
          throw err;
        }
        const { user } = await meRes.json();
        if (user.role !== 'mentor') {
          const err = new Error(t('mentorOnly'));
          err.code = 'wrong_role';
          throw err;
        }
        document.getElementById('header-email').textContent = user.email;
        document.getElementById('display-name').value = user.displayName || '';

        const [pendingRes, outgoingRes, approvedRes, sponsorRes, usageRes, walletRes] =
          await Promise.all([
            api('/v1/shares/pending-for-me'),
            api('/v1/shares?status=pending'),
            api('/v1/shares?status=approved'),
            api('/v1/sponsorships/mine'),
            api('/v1/usage/summary'),
            api('/v1/wallet'),
          ]);
        if (!pendingRes.ok || !outgoingRes.ok || !approvedRes.ok) {
          throw new Error(t('couldNotLoadShares'));
        }
        const pending = (await pendingRes.json()).shares || [];
        const allPending = (await outgoingRes.json()).shares || [];
        const outgoing = allPending.filter((s) => s.initiatedBy === 'mentor');
        const approved = (await approvedRes.json()).shares || [];
        const sponsored = sponsorRes.ok ? (await sponsorRes.json()).sponsorships || [] : [];
        const usage = usageRes.ok ? await usageRes.json() : null;
        const wallet = walletRes.ok ? (await walletRes.json()).wallet : null;

        document.getElementById('wallet-balance').textContent = wallet
          ? String(wallet.balanceTokens)
          : '—';
        document.getElementById('balance-chip').textContent = wallet
          ? wallet.balanceTokens + ' ' + t('tokensUnit')
          : '— ' + t('tokensUnit');
        document.getElementById('wallet-pm').textContent = t('paymentMethod', {
          value: wallet
            ? wallet.paymentMethodOnFile
              ? t('pmCard')
              : t('pmNone')
            : t('pmUnknown'),
        });

        renderUsageSummary(document.getElementById('usage-summary'), usage);

        const BUSY_LABEL = {
          approve: 'approving',
          reject: 'rejecting',
          cancel: 'cancelling',
          revoke: 'revoking',
          'sponsor-on': 'starting',
          'sponsor-off': 'stopping',
        };

        async function act(action, id, meta) {
          showError(appErrorEl(), '');
          const email = meta?.email || '';
          const btn = meta?.btn;

          if (action === 'revoke') {
            if (!window.confirm(t('confirmRevoke', { email }))) return;
          }
          if (action === 'cancel') {
            if (!window.confirm(t('confirmCancel', { email }))) return;
          }

          const run = async () => {
            if (action === 'sponsor-on') {
              const days = meta?.days || 90;
              const exp = new Date();
              exp.setUTCDate(exp.getUTCDate() + days);
              const res = await api('/v1/sponsorships/enable', {
                method: 'POST',
                body: JSON.stringify({ patientId: id, expiresAt: exp.toISOString() }),
              });
              if (!res.ok) {
                throw new Error(
                  (await res.json().catch(() => ({}))).error || t('couldNotStartSponsorship'),
                );
              }
              return t('resultSponsorOn', {
                email,
                days: pluralDays(days),
                date: formatExpiry(exp.toISOString()),
              });
            }
            if (action === 'sponsor-off') {
              const res = await api('/v1/sponsorships/disable', {
                method: 'POST',
                body: JSON.stringify({ patientId: id }),
              });
              if (!res.ok) {
                throw new Error(
                  (await res.json().catch(() => ({}))).error || t('couldNotStopSponsorship'),
                );
              }
              return t('resultSponsorOff', { email });
            }
            const res = await api('/v1/shares/' + id + '/' + action, { method: 'POST' });
            if (!res.ok) {
              throw new Error((await res.json().catch(() => ({}))).error || t('actionFailed'));
            }
            return (
              {
                approve: t('resultApproved', { email }),
                reject: t('resultRejected', { email }),
                cancel: t('resultCancelled', { email }),
                revoke: t('resultRevoked', { email }),
              }[action] || t('done')
            );
          };

          try {
            const message = btn
              ? await withBusy(btn, t(BUSY_LABEL[action] || 'working'), run)
              : await run();
            await refreshDashboard();
            // After refreshDashboard, which re-renders the rows — the flash sits
            // outside them so the confirmation survives.
            setFlash('ok', message);
          } catch (e) {
            setFlash('err', e instanceof Error ? e.message : t('actionFailed'));
          }
        }

        worklistState.pending = pending;
        worklistState.outgoing = outgoing;
        worklistState.approved = approved;
        worklistState.sponsorByPatient = new Map(sponsored.map((s) => [s.patientId, s]));
        worklistState.act = act;
        setCounts();
        renderWorklist();
        applyDevMode();
      }

      /* ── views ─────────────────────────────────────────────────────────── */

      function showLoginView() {
        document.body.classList.remove('portal-app');
        document.getElementById('login-view').hidden = false;
        document.getElementById('app-view').hidden = true;
      }

      function showAppView() {
        document.body.classList.add('portal-app');
        document.getElementById('login-view').hidden = true;
        document.getElementById('app-view').hidden = false;
        applyDevMode();
      }

      function showCodeStep(email) {
        loginEmail = email;
        document.getElementById('email').value = email;
        document.getElementById('login-form-email').hidden = true;
        document.getElementById('login-form-code').hidden = false;
        document.getElementById('email-display').textContent = email;
      }

      function showEmailStep() {
        try {
          localStorage.removeItem(OTP_PENDING_KEY);
        } catch {
          /* ignore */
        }
        loginEmail = '';
        document.getElementById('code').value = '';
        document.getElementById('login-form-email').hidden = false;
        document.getElementById('login-form-code').hidden = true;
      }

      function restoreOtpPending() {
        try {
          const pending = localStorage.getItem(OTP_PENDING_KEY);
          if (pending) showCodeStep(pending);
        } catch {
          /* ignore */
        }
      }

      async function boot() {
        applyLocale();
        applyDevMode();
        const tokens = loadTokens();
        if (!tokens?.access) {
          restoreOtpPending();
          return;
        }
        try {
          await refreshDashboard();
          showAppView();
        } catch (e) {
          const msg = e instanceof Error ? e.message : t('couldNotLoadPortal');
          const status = e && typeof e === 'object' ? e.status : undefined;
          const wrongRole = e && typeof e === 'object' && e.code === 'wrong_role';
          if (status === 401 || msg === t('sessionExpired') || wrongRole) {
            clearTokens();
            showLoginView();
            showError(loginErrorEl(), msg);
            return;
          }
          // Keep session on transient/API errors — clinician can retry without re-OTP.
          showAppView();
          showError(appErrorEl(), msg);
        }
      }

      /* ── events ────────────────────────────────────────────────────────── */

      document.getElementById('login-form-email').addEventListener('submit', async (e) => {
        e.preventDefault();
        showError(loginErrorEl(), '');
        const btn = document.getElementById('send-code');
        loginEmail = document.getElementById('email').value.trim().toLowerCase();
        if (!loginEmail) {
          showError(loginErrorEl(), t('enterEmail'));
          document.getElementById('email').focus();
          return;
        }
        await withBusy(btn, t('sendingCode'), async () => {
          try {
            const res = await api('/v1/auth/otp/request', {
              method: 'POST',
              body: JSON.stringify({ email: loginEmail, role: 'mentor' }),
            });
            if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              showError(loginErrorEl(), err.error || t('couldNotSendCode'));
              return;
            }
          } catch {
            showError(loginErrorEl(), t('unreachable'));
            return;
          }
          try {
            localStorage.setItem(OTP_PENDING_KEY, loginEmail);
          } catch {
            /* ignore */
          }
          showCodeStep(loginEmail);
        });
      });

      document.getElementById('change-email').onclick = () => {
        showError(loginErrorEl(), '');
        showEmailStep();
      };

      document.getElementById('login-form-code').addEventListener('submit', async (e) => {
        e.preventDefault();
        showError(loginErrorEl(), '');
        const btn = document.getElementById('verify-code');
        const code = document.getElementById('code').value.trim();
        if (!loginEmail) {
          showError(loginErrorEl(), t('enterEmailFirst'));
          showEmailStep();
          return;
        }
        if (code.length !== 6) {
          showError(loginErrorEl(), t('enterCode'));
          document.getElementById('code').focus();
          return;
        }
        await withBusy(btn, t('signingIn'), async () => {
          try {
            const res = await api('/v1/auth/otp/verify', {
              method: 'POST',
              body: JSON.stringify({ email: loginEmail, code }),
            });
            if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              showError(loginErrorEl(), err.error || t('invalidCode'));
              return;
            }
            const data = await res.json();
            saveTokens(data.accessToken, data.refreshToken);
            try {
              localStorage.removeItem(OTP_PENDING_KEY);
            } catch {
              /* ignore */
            }
            showAppView();
            try {
              await refreshDashboard();
            } catch (err) {
              const msg = err instanceof Error ? err.message : t('couldNotLoadPortal');
              const wrongRole = err && typeof err === 'object' && err.code === 'wrong_role';
              if (wrongRole) {
                clearTokens();
                showLoginView();
                showError(loginErrorEl(), msg);
              } else {
                showError(appErrorEl(), msg);
              }
            }
          } catch {
            showError(loginErrorEl(), t('unreachable'));
          }
        });
      });

      document.getElementById('logout').onclick = () => {
        clearTokens();
        try {
          localStorage.removeItem(OTP_PENDING_KEY);
        } catch {
          /* ignore */
        }
        location.reload();
      };

      document.querySelectorAll('.chip-btn[data-filter]').forEach((btn) => {
        btn.addEventListener('click', () => {
          worklistState.filter = btn.getAttribute('data-filter');
          worklistState.page = 0;
          document.querySelectorAll('.chip-btn[data-filter]').forEach((b) => {
            const on = b === btn;
            b.classList.toggle('active', on);
            b.setAttribute('aria-pressed', on ? 'true' : 'false');
          });
          renderWorklist();
        });
      });

      let searchTimer = null;
      document.getElementById('worklist-search').addEventListener('input', (e) => {
        const value = e.target.value;
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          worklistState.search = value;
          worklistState.page = 0;
          renderWorklist();
        }, 150);
      });

      document.getElementById('worklist-sort').addEventListener('change', (e) => {
        worklistState.sort = e.target.value;
        worklistState.page = 0;
        renderWorklist();
      });

      document.getElementById('pager-prev').onclick = () => {
        if (worklistState.page > 0) {
          worklistState.page -= 1;
          renderWorklist();
        }
      };
      document.getElementById('pager-next').onclick = () => {
        worklistState.page += 1;
        renderWorklist();
      };

      document.getElementById('save-name').onclick = async () => {
        showError(appErrorEl(), '');
        const btn = document.getElementById('save-name');
        const displayName = document.getElementById('display-name').value.trim();
        setStatus('name-status', '', '');
        await withBusy(btn, t('saving'), async () => {
          try {
            const res = await api('/v1/me', {
              method: 'PATCH',
              body: JSON.stringify({ displayName }),
            });
            if (!res.ok) {
              setStatus(
                'name-status',
                'err',
                (await res.json().catch(() => ({}))).error || t('couldNotSaveName'),
              );
              return;
            }
            setStatus(
              'name-status',
              'ok',
              displayName ? t('nameSaved', { name: displayName }) : t('nameCleared'),
            );
          } catch (err) {
            setStatus('name-status', 'err', err instanceof Error ? err.message : t('couldNotSaveName'));
          }
        });
      };

      document.getElementById('invite-btn').onclick = async () => {
        showError(appErrorEl(), '');
        const btn = document.getElementById('invite-btn');
        const input = document.getElementById('patient-email');
        const patientEmail = input.value.trim().toLowerCase();
        if (!patientEmail) {
          setInviteStatus('err', t('inviteNeedsEmail'));
          input.focus();
          return;
        }
        if (!patientEmail.includes('@')) {
          setInviteStatus('err', t('inviteNotEmail'));
          input.focus();
          return;
        }

        await withBusy(btn, t('sendingInvite'), async () => {
          input.disabled = true;
          setInviteStatus('', '');
          try {
            const res = await api('/v1/shares/invite', {
              method: 'POST',
              body: JSON.stringify({ patientEmail }),
            });
            if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              setInviteStatus('err', err.error || t('inviteFailed'));
              return;
            }
            const data = await res.json().catch(() => ({}));
            input.value = '';
            await refreshDashboard();
            setInviteStatus(
              data && data.emailSent === false ? 'warn' : 'ok',
              data && data.emailSent === false
                ? t('inviteSavedNoEmail', { email: patientEmail })
                : t('inviteSent', { email: patientEmail }),
            );
          } catch (err) {
            setInviteStatus('err', err instanceof Error ? err.message : t('inviteFailedNetwork'));
          } finally {
            input.disabled = false;
          }
        });
      };

      document.getElementById('patient-email').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          document.getElementById('invite-btn').click();
        }
      });
      document.getElementById('patient-email').addEventListener('input', () => {
        const el = document.getElementById('invite-status');
        if (!el.hidden && el.classList.contains('err')) setInviteStatus('', '');
      });

      document.getElementById('simulate-card-btn').onclick = async () => {
        showError(appErrorEl(), '');
        const btn = document.getElementById('simulate-card-btn');
        setFlash('', '');
        await withBusy(btn, t('attaching'), async () => {
          try {
            const res = await api('/v1/wallet/payment-method/simulate', {
              method: 'POST',
              body: '{}',
            });
            if (!res.ok) {
              setFlash('err', (await res.json().catch(() => ({}))).error || t('couldNotAttachCard'));
              return;
            }
            await refreshDashboard();
            setFlash('ok', t('cardAttached'));
          } catch (err) {
            setFlash('err', err instanceof Error ? err.message : t('couldNotAttachCard'));
          }
        });
      };

      document.getElementById('load-pack-btn').onclick = async () => {
        showError(appErrorEl(), '');
        const btn = document.getElementById('load-pack-btn');
        setFlash('', '');
        await withBusy(btn, t('adding'), async () => {
          try {
            const res = await api('/v1/wallet/add-pack', { method: 'POST', body: '{}' });
            if (!res.ok) {
              setFlash('err', (await res.json().catch(() => ({}))).error || t('couldNotAddCredits'));
              return;
            }
            await refreshDashboard();
            setFlash('ok', t('creditsAdded', { balance: document.getElementById('wallet-balance').textContent }));
          } catch (err) {
            setFlash('err', err instanceof Error ? err.message : t('couldNotAddCredits'));
          }
        });
      };

      boot();
    </script>
  </body>
</html>
