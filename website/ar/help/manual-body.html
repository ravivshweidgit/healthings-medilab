        <h1>إدخال الجسم يدوياً</h1>
        <p class="lead">أدخل الوزن (والتركيب إن وُجد) إن لم يزامن الميزان بعد.</p>
        <p class="help-glossary">مصطلحات مثل <strong>kcal</strong> و <strong>BMR</strong> و <strong>CGM</strong> وعلامات مثل <strong>Withings</strong> تبقى بالإنجليزية.</p>
      </section>
