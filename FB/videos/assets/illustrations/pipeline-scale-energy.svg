<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <title>Scale to Trend Energy and BMR</title>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B8DAF0"/>
      <stop offset="0.14" stop-color="#D6EBF8"/>
      <stop offset="0.32" stop-color="#F0F4F8"/>
      <stop offset="1" stop-color="#F0F4F8"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1A2B4A" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#page)"/>
  <g font-family="Montserrat" text-anchor="middle">
    <text x="540" y="120" fill="#1A2B4A" font-size="34" font-weight="700" letter-spacing="1.4">HEALTHINGS.AI</text>
    <rect x="250" y="158" width="580" height="42" rx="21" fill="#E8F4FC" stroke="#3D9DD6" stroke-opacity="0.35" stroke-width="2"/>
    <text x="540" y="186" fill="#1A2B4A" font-size="18" font-weight="700" letter-spacing="1.6">SCALE - TREND - ENERGY - BMR</text>
  </g>

  <!-- Body composition strip -->
  <g font-family="Montserrat" filter="url(#cardShadow)">
    <rect x="100" y="260" width="880" height="220" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="140" y="310" fill="#5C6B7A" font-size="22" font-weight="700" letter-spacing="1.2">BODY</text>
    <text x="200" y="380" fill="#1A2B4A" font-size="36" font-weight="700" text-anchor="middle">77.5</text>
    <text x="200" y="415" fill="#5C6B7A" font-size="20" font-weight="500" text-anchor="middle">kg</text>
    <text x="400" y="380" fill="#1A2B4A" font-size="36" font-weight="700" text-anchor="middle">61.5</text>
    <text x="400" y="415" fill="#5C6B7A" font-size="20" font-weight="500" text-anchor="middle">muscle</text>
    <text x="600" y="380" fill="#1A2B4A" font-size="36" font-weight="700" text-anchor="middle">12.8</text>
    <text x="600" y="415" fill="#5C6B7A" font-size="20" font-weight="500" text-anchor="middle">fat</text>
    <text x="820" y="380" fill="#3D9DD6" font-size="36" font-weight="700" text-anchor="middle">1848</text>
    <text x="820" y="415" fill="#5C6B7A" font-size="20" font-weight="500" text-anchor="middle">BMR kcal</text>
  </g>

  <!-- Trend chart card -->
  <g font-family="Montserrat" filter="url(#cardShadow)">
    <rect x="100" y="520" width="880" height="520" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="140" y="575" fill="#5C6B7A" font-size="22" font-weight="700" letter-spacing="1.2">TREND</text>
    <text x="940" y="575" fill="#3D9DD6" font-size="20" font-weight="600" text-anchor="end">7 days</text>
    <!-- weight line -->
    <text x="140" y="620" fill="#1A2B4A" font-size="20" font-weight="600">Weight</text>
    <polyline fill="none" stroke="#3D9DD6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
      points="160,700 280,690 400,675 520,660 640,650 760,640 880,630"/>
    <circle cx="880" cy="630" r="8" fill="#3D9DD6"/>
    <!-- fat / muscle mini strips -->
    <text x="140" y="780" fill="#1A2B4A" font-size="20" font-weight="600">Fat / muscle</text>
    <polyline fill="none" stroke="#E85D4C" stroke-width="4" stroke-linecap="round"
      points="160,840 280,845 400,838 520,830 640,825 760,820 880,815"/>
    <polyline fill="none" stroke="#2F9E6B" stroke-width="4" stroke-linecap="round"
      points="160,880 280,875 400,870 520,865 640,860 760,858 880,855"/>
    <text x="160" y="990" fill="#E85D4C" font-size="18" font-weight="600">fat</text>
    <text x="260" y="990" fill="#2F9E6B" font-size="18" font-weight="600">muscle</text>
  </g>

  <!-- Energy + BMR -->
  <g font-family="Montserrat" filter="url(#cardShadow)">
    <rect x="100" y="1080" width="880" height="620" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="140" y="1135" fill="#5C6B7A" font-size="22" font-weight="700" letter-spacing="1.2">ENERGY</text>
    <text x="140" y="1200" fill="#5C6B7A" font-size="22" font-weight="500">eaten</text>
    <text x="940" y="1200" fill="#1A2B4A" font-size="28" font-weight="700" text-anchor="end">615</text>
    <rect x="140" y="1220" width="220" height="28" rx="8" fill="#7B6CF6"/>
    <text x="140" y="1295" fill="#5C6B7A" font-size="22" font-weight="500">burned</text>
    <text x="940" y="1295" fill="#1A2B4A" font-size="28" font-weight="700" text-anchor="end">2010</text>
    <rect x="140" y="1315" width="700" height="28" rx="8" fill="#3D9DD6"/>
    <text x="140" y="1385" fill="#5C6B7A" font-size="22" font-weight="500">BMR + activity</text>
    <rect x="140" y="1420" width="880" height="90" rx="18" fill="#E8F8EF"/>
    <text x="540" y="1478" fill="#1B7A4A" font-size="32" font-weight="700" text-anchor="middle">1395 kcal deficit</text>
    <text x="140" y="1580" fill="#1A2B4A" font-size="26" font-weight="600">BMR is your resting burn</text>
    <text x="140" y="1630" fill="#5C6B7A" font-size="24" font-weight="500">the floor under every energy day</text>
  </g>
</svg>
