<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1080 1920" width="1080" height="1920">
  <title>Healthings closed cycle</title>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0F4F8" stop-opacity="0.72"/>
      <stop offset="0.4" stop-color="#F0F4F8" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#F0F4F8" stop-opacity="0.94"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-40%" width="160%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1A2B4A" flood-opacity="0.12"/>
    </filter>
    <filter id="logoShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1A2B4A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <image href="_bg-clinic.jpg" x="-200" y="200" width="1480" height="1520" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1080" height="1920" fill="url(#wash)"/>

  <g font-family="Montserrat" text-anchor="middle">
    <text x="540" y="128" fill="#1A2B4A" font-size="34" font-weight="700"
          letter-spacing="1.4">HEALTHINGS.AI</text>
    <rect x="380" y="168" width="320" height="42" rx="21" fill="#E8F4FC" stroke="#3D9DD6"
          stroke-opacity="0.35" stroke-width="2"/>
    <text x="540" y="196" fill="#1A2B4A" font-size="18" font-weight="700"
          letter-spacing="2.6">ONE CLOSED LOOP</text>
  </g>

  <circle cx="540" cy="900" r="330" fill="none" stroke="#3D9DD6" stroke-width="8"/>
  <circle cx="540" cy="900" r="330" fill="none" stroke="#FFFFFF" stroke-width="2"
          stroke-dasharray="10 22" opacity="0.9"/>

  <g filter="url(#logoShadow)">
    <circle cx="540" cy="900" r="88" fill="#FFFFFF"/>
    <image href="healthings-icon.png" x="482" y="842" width="116" height="116"/>
  </g>

  <g font-family="Montserrat" text-anchor="middle">
    <g filter="url(#cardShadow)">
      <rect x="415" y="512" width="250" height="116" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
      <rect x="745" y="842" width="250" height="116" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
      <rect x="415" y="1172" width="250" height="116" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
      <rect x="85" y="842" width="250" height="116" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    </g>

    <text x="540" y="560" fill="#1A2B4A" font-size="32" font-weight="700">Clinic</text>
    <text x="540" y="600" fill="#5C6B7A" font-size="21" font-weight="500">directs</text>

    <text x="870" y="890" fill="#1A2B4A" font-size="32" font-weight="700">Rules</text>
    <text x="870" y="930" fill="#5C6B7A" font-size="21" font-weight="500">live in the app</text>

    <text x="540" y="1220" fill="#1A2B4A" font-size="32" font-weight="700">App + AI</text>
    <text x="540" y="1260" fill="#5C6B7A" font-size="21" font-weight="500">executes daily</text>

    <text x="210" y="884" fill="#1A2B4A" font-size="32" font-weight="700">Gear</text>
    <text x="210" y="920" fill="#5C6B7A" font-size="19" font-weight="500">scale &#183; watch</text>
    <text x="210" y="946" fill="#5C6B7A" font-size="19" font-weight="500">CGM</text>
  </g>
</svg>
