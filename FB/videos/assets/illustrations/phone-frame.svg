<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <title>Healthings phone frame overlay - site design system</title>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B8DAF0"/>
      <stop offset="0.14" stop-color="#D6EBF8"/>
      <stop offset="0.32" stop-color="#F0F4F8"/>
      <stop offset="1" stop-color="#F0F4F8"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#2A2A2A"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <filter id="phoneShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#1A2B4A" flood-opacity="0.22"/>
    </filter>
    <mask id="screenHole">
      <rect width="1080" height="1920" fill="#fff"/>
      <rect x="200" y="242" width="680" height="1300" rx="34" fill="#000"/>
    </mask>
  </defs>

  <g mask="url(#screenHole)">
    <rect width="1080" height="1920" fill="url(#page)"/>
    <rect x="170" y="190" width="740" height="1386" rx="58"
          fill="url(#body)" filter="url(#phoneShadow)"/>
  </g>

  <rect x="470" y="212" width="140" height="10" rx="5" fill="#3A3A3A"/>

  <g font-family="Montserrat" text-anchor="middle">
    <text x="540" y="126" fill="#1A2B4A" font-size="34" font-weight="700"
          letter-spacing="1.4">HEALTHINGS.AI</text>
  </g>
</svg>
