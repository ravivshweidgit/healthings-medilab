<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Healthings closed cycle - slate - 16:9</title>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3038"/>
      <stop offset="0.5" stop-color="#1C2128"/>
      <stop offset="1" stop-color="#14181E"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E53935"/>
      <stop offset="1" stop-color="#B71C1C"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-40%" width="160%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#page)"/>

  <text x="80" y="84" font-family="Montserrat" fill="#F3F5F7" font-size="28"
        font-weight="700" letter-spacing="3">HEALTHINGS.AI</text>
  <text x="80" y="122" font-family="Montserrat" fill="#8B95A1" font-size="15"
        font-weight="600" letter-spacing="3.2">ONE CLOSED LOOP</text>

  <!-- Closed loop ring — no arrowheads -->
  <circle cx="960" cy="540" r="300" fill="none" stroke="#6EB6E0" stroke-width="3.5"
          opacity="0.85"/>
  <circle cx="960" cy="540" r="300" fill="none" stroke="#6EB6E0" stroke-width="1.5"
          stroke-dasharray="2 14" opacity="0.35"/>

  <!-- Quiet hub links -->
  <g stroke="#6EB6E0" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.55">
    <line x1="960" y1="455" x2="960" y2="318"/>
    <line x1="1110" y1="540" x2="1180" y2="540"/>
    <line x1="960" y1="605" x2="960" y2="762"/>
    <line x1="810" y1="540" x2="740" y2="540"/>
  </g>

  <path d="M 960 488 C 948 468, 922 470, 922 492 C 922 512, 946 528, 960 540
           C 974 528, 998 512, 998 492 C 998 470, 972 468, 960 488 Z"
        fill="url(#heart)"/>
  <text x="960" y="580" font-family="Montserrat" text-anchor="middle"
        fill="#F3F5F7" font-size="22" font-weight="700" letter-spacing="3.5">HEALTHINGS.AI</text>

  <g font-family="Montserrat" text-anchor="middle">
    <g filter="url(#cardShadow)">
      <rect x="835" y="192" width="250" height="100" rx="14" fill="#2C333C"
            stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
      <rect x="1180" y="490" width="250" height="100" rx="14" fill="#2C333C"
            stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
      <rect x="835" y="788" width="250" height="100" rx="14" fill="#2C333C"
            stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
      <rect x="490" y="490" width="250" height="100" rx="14" fill="#2C333C"
            stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    </g>

    <!-- Tracked caps — diagram labels, not marketing copy -->
    <text x="960" y="250" fill="#F3F5F7" font-size="26" font-weight="700"
          letter-spacing="4">CLINIC</text>
    <text x="1305" y="548" fill="#F3F5F7" font-size="26" font-weight="700"
          letter-spacing="4">RULES</text>
    <text x="960" y="846" fill="#F3F5F7" font-size="24" font-weight="700"
          letter-spacing="3">APP + AI</text>
    <text x="615" y="548" fill="#F3F5F7" font-size="26" font-weight="700"
          letter-spacing="4">GEAR</text>
  </g>
</svg>
