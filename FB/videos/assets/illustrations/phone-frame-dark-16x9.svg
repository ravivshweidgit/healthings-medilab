<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Healthings phone frame overlay dark - 16:9</title>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3038"/>
      <stop offset="0.5" stop-color="#1C2128"/>
      <stop offset="1" stop-color="#14181E"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#2A2A2A"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <filter id="phoneShadow" x="-40%" y="-25%" width="180%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <mask id="screenHole">
      <rect width="1920" height="1080" fill="#fff"/>
      <rect x="600" y="105" width="720" height="1376" rx="34" fill="#000"/>
    </mask>
  </defs>

  <g mask="url(#screenHole)">
    <rect width="1920" height="1080" fill="url(#page)"/>
    <rect x="568" y="50" width="784" height="1500" rx="56"
          fill="url(#body)" filter="url(#phoneShadow)"/>
  </g>

  <rect x="905" y="70" width="110" height="8" rx="4" fill="#3A3A3A"/>

  <text x="80" y="84" font-family="Montserrat" fill="#F3F5F7" font-size="28"
        font-weight="700" letter-spacing="3">HEALTHINGS.AI</text>
</svg>
