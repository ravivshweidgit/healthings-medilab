<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <title>Healthings end card</title>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B8DAF0"/>
      <stop offset="0.14" stop-color="#D6EBF8"/>
      <stop offset="0.32" stop-color="#F0F4F8"/>
      <stop offset="1" stop-color="#F0F4F8"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1A2B4A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#page)"/>

  <g filter="url(#cardShadow)">
    <rect x="110" y="700" width="860" height="520" rx="20" fill="#FFFFFF"
          stroke="#E2E8F0" stroke-width="2"/>
  </g>

  <g font-family="Montserrat" text-anchor="middle">
    <text x="540" y="852" fill="#1A2B4A" font-size="62" font-weight="700"
          letter-spacing="2.4">HEALTHINGS.AI</text>

    <path d="M 310 902 H 462 L 490 874 L 518 938 L 546 888 L 570 902 H 770"
          fill="none" stroke="#00A8C0" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round"/>

    <text x="540" y="1002" fill="#5C6B7A" font-size="32" font-weight="500">One loop, closed.</text>

    <rect x="290" y="1046" width="500" height="52" rx="26" fill="#E8F4FC"
          stroke="#3D9DD6" stroke-opacity="0.35" stroke-width="2"/>
    <text x="540" y="1081" fill="#1A2B4A" font-size="20" font-weight="700"
          letter-spacing="3">CLINIC &#183; RULES &#183; GEAR &#183; AI</text>

    <text x="540" y="1170" fill="#1B6B96" font-size="36" font-weight="700"
          letter-spacing="1">healthings.ai</text>
  </g>
</svg>
